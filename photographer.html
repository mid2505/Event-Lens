<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographer Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Event Lens</a>
            <div class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="about.html">About</a>
                <a href="index.html#contact">Contact</a>
            </div>
            <div class="nav-right">
                <div id="auth-links">
                    <!-- Auth links will be injected by auth.js -->
                </div>
                <button id="theme-toggle-btn"><i class="ri-sun-line"></i></button>
            </div>
        </nav>
    </header>

    <!-- THIS IS THE FIX: Implement the two-column layout defined in your CSS -->
    <div class="photographer-page-container">
        
        <!-- Sidebar Column -->
        <aside class="photographer-sidebar">
            <div class="sidebar-section">
                <img id="photographer-avatar" class="profile-avatar" src="https://i.pravatar.cc/150" alt="Photographer">
                <h1 id="photographer-name" class="profile-name">Loading...</h1>
                <p id="photographer-location" class="profile-location"><i class="ri-map-pin-line"></i> Loading...</p>
                <button id="book-now-btn" class="book-btn">Book Now</button>
            </div>

            <div class="sidebar-section">
                <h3>About Me</h3>
                <p id="photographer-about" class="about-text">Loading bio...</p>
            </div>

            <div class="sidebar-section">
                <h3>Specialties</h3>
                <div id="photographer-specialties" class="specialties-list">
                    <!-- Specialty tags will be injected by photographer.js -->
                </div>
            </div>
        </aside>

        <!-- Main Content Column -->
        <main class="photographer-main">
            <div class="profile-section">
                <h2>Portfolio</h2>
                <div id="photographer-gallery" class="portfolio-grid">
                    <!-- Photos will be injected by photographer.js -->
                </div>
            </div>
        </main>

    </div>

    <!-- Booking Modal -->
    <div id="booking-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-modal-btn" class="modal-close-btn"><i class="ri-close-line"></i></button>
            <h2>Book Photographer</h2>
            <p>Send a booking request. The photographer will confirm their availability.</p>
            <form id="booking-form">
                <div class="form-group">
                    <label for="event-date">Event Date</label>
                    <input type="date" id="event-date" name="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="event-message">Message (optional)</label>
                    <textarea id="event-message" name="message" rows="4" placeholder="Tell the photographer about your event..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Request</button>
                <p id="booking-error-message" class="error-message"></p>
            </form>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script type="module" src="script.js?v=1.1"></script>
    <script type="module" src="photographer.js"></script>
    <script type="module" src="config.js"></script>
</body>
</html>
