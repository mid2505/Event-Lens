<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script type="module" src="auth.js" defer></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
            <div class="sidebar-header"><a href="index.html" class="logo">Event Lens</a></div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#profile" class="nav-item active"><i class="ri-user-line"></i><span>My Profile</span></a></li>
                    <li><a href="#photos" class="nav-item"><i class="ri-camera-lens-line"></i><span>Manage Photos</span></a></li>
                    <li><a href="#bookings" class="nav-item"><i class="ri-calendar-check-line"></i><span>Bookings</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer"><button onclick="logout()" class="logout-btn"><i class="ri-logout-box-r-line"></i><span>Logout</span></button></div>
        </aside>

        <main class="dashboard-main-content">
            <header class="dashboard-main-header">
                <h1 id="dashboard-title">My Profile</h1>
            </header>

            <section id="profile" class="dashboard-panel active">
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3>Profile Information</h3>
                        <div class="card-actions">
                            <button id="edit-profile-btn" class="submit-btn small"><i class="ri-pencil-line"></i> Edit</button>
                            <button id="save-profile-btn" class="submit-btn small" style="display: none;">Save Changes</button>
                            <button id="cancel-edit-btn" class="cancel-btn" style="display: none;">Cancel</button>
                        </div>
                    </div>
                    <form id="profile-update-form">
                        <div class="profile-picture-area">
                            <img id="profile-picture-preview" src="https://i.pravatar.cc/150" alt="Profile Picture">
                            <label for="profile-picture-input" class="edit-overlay" style="display: none;">
                                <i class="ri-camera-line"></i>
                                <span>Change</span>
                            </label>
                            <input type="file" id="profile-picture-input" name="profilePicture" accept="image/*" style="display: none;">
                        </div>
                        <div class="profile-details-grid">
                            <div class="detail-item"><label>Full Name</label><p data-field="name"></p><input type="text" name="name" style="display: none;"></div>
                            <div class="detail-item"><label>Email</label><p data-field="email"></p><input type="email" name="email" style="display: none;"></div>
                            <div class="detail-item"><label>Location</label><p data-field="location"></p><input type="text" name="location" style="display: none;"></div>
                            <div class="detail-item"><label>Specialties</label><p data-field="specialties"></p><input type="text" name="specialties" placeholder="Comma-separated" style="display: none;"></div>
                            <div class="detail-item full-width"><label>About Me</label><p data-field="about"></p><textarea name="about" rows="4" style="display: none;"></textarea></div>
                        </div>
                    </form>
                </div>
            </section>

            <section id="photos" class="dashboard-panel">
                <div class="dashboard-card">
                    <h3>Upload New Photo</h3>
                    <form id="photo-upload-form">
                        <div class="form-grid">
                            <div class="form-group"><label for="photo-title">Photo Title</label><input type="text" id="photo-title" name="title" required></div>
                            <div class="form-group"><label for="photo-category">Category</label><input type="text" id="photo-category" name="category" required></div>
                        </div>
                        <div class="form-group"><label for="photo-file">Image File</label><input type="file" id="photo-file" name="photo" accept="image/*" required></div>
                        <button type="submit" class="submit-btn">Upload Photo</button>
                    </form>
                </div>
                <div class="dashboard-card"><h3>My Portfolio</h3><div id="portfolio-management-grid" class="portfolio-management-grid"></div></div>
            </section>

            <section id="bookings" class="dashboard-panel">
                <div class="dashboard-card">
                    <h3>Booking Requests</h3>
                    <div id="bookings-list"></div>
                </div>
            </section>

            <div class="dashboard-section">
                <h2>Photo Management</h2>
                <div class="photo-actions">
                    <button id="watermark-tool-btn" class="action-btn watermark-btn">Watermark Tool</button>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="photographer-dashboard.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="config.js"></script>
</body>
</html>
