<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Image Watermark Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🖼️ Digital Image Watermark Tool</h1>
            <p>Upload an image and apply a custom watermark</p>
        </header>

        <main>
            <div class="upload-section">
                <form id="watermarkForm" enctype="multipart/form-data">
                    <div class="file-upload">
                        <label for="imageFile" class="file-label">
                            <span class="upload-icon">📁</span>
                            <span class="upload-text">Choose Image File</span>
                        </label>
                        <input type="file" id="imageFile" name="image" accept="image/*" required>
                        <div class="file-info" id="fileInfo"></div>
                    </div>

                    <div class="watermark-options">
                        <h3>Watermark Settings</h3>
                        
                        <div class="form-group">
                            <label for="watermarkText">Watermark Text:</label>
                            <input type="text" id="watermarkText" name="watermarkText" value="© WATERMARK" maxlength="50">
                        </div>

                        <div class="form-group">
                            <label for="position">Position:</label>
                            <select id="position" name="position">
                                <option value="bottom-right">Bottom Right</option>
                                <option value="bottom-left">Bottom Left</option>
                                <option value="top-right">Top Right</option>
                                <option value="top-left">Top Left</option>
                                <option value="center">Center</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="opacity">Opacity: <span id="opacityValue">0.5</span></label>
                            <input type="range" id="opacity" name="opacity" min="0.1" max="1" step="0.1" value="0.5">
                        </div>

                        <div class="form-group">
                            <label for="fontSize">Font Size: <span id="fontSizeValue">48</span>px</label>
                            <input type="range" id="fontSize" name="fontSize" min="20" max="100" step="5" value="48">
                        </div>

                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span class="btn-text">Apply Watermark</span>
                            <span class="loader" id="loader"></span>
                        </button>
                    </div>
                </form>
            </div>

            <div class="preview-section" id="previewSection">
                <h3>Preview</h3>
                <div class="image-container">
                    <div class="image-preview">
                        <h4>Original Image</h4>
                        <img id="originalImage" alt="Original image preview">
                    </div>
                    <div class="image-preview">
                        <h4>Watermarked Image</h4>
                        <img id="watermarkedImage" alt="Watermarked image preview">
                        <div class="download-section" id="downloadSection">
                            <a href="#" id="downloadLink" class="download-btn" download>
                                📥 Download Watermarked Image
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="message" id="message"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
