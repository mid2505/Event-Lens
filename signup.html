<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Event Lens</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <div class="auth-container">
        <div class="auth-form-wrapper">
            <h2>Create Your Account</h2>
            <p class="auth-subtitle">Join the largest community of photographers and clients.</p>
            
            <form id="signup-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <!-- This MUST be an <a> tag pointing to your backend -->
            <a href="http://localhost:5001/auth/microsoft" class="social-btn microsoft-btn">
                <i class="ri-microsoft-fill"></i>
                Continue with Microsoft
            </a>

            <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
        </div>
    </div>
    <script type="module" src="main.js"></script>
    <script type="module" src="config.js"></script>
</body>
</html>
